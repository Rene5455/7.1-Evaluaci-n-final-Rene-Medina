<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mi Blog Personal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">TechBlog</a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5">
        <h2 class="mb-4">Formulario de Contacto</h2>
        
        <div id="formAlert" class="alert d-none" role="alert"></div>

        <form id="contactForm" novalidate class="p-4 border rounded bg-light shadow-sm">
            <div class="mb-3">
                <label for="nameInput" class="form-label">Nombre Completo</label>
                <input type="text" class="form-control" id="nameInput" required>
                <div class="invalid-feedback">Por favor ingresa tu nombre.</div>
            </div>

            <div class="mb-3">
                <label for="emailInput" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="emailInput" required>
                <div class="invalid-feedback">Ingresa un correo electrónico válido.</div>
            </div>

            <div class="mb-3">
                <label for="messageInput" class="form-label">Mensaje</label>
                <textarea class="form-control" id="messageInput" rows="4" required></textarea>
                <div class="invalid-feedback">El mensaje no puede estar vacío.</div>
            </div>

            <button type="submit" class="btn btn-primary">Enviar Mensaje</button>
        </form>
    </main>

    <footer class="bg-dark text-white text-center py-4 mt-5">
        <div class="container"><p class="mb-0">&copy; 2026 TechBlog</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
